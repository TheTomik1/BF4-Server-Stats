services:
  web:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
    env_file:
      - .env
    ports:
       - "127.0.0.1:${WEB_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
    volumes:
      - ./docker/config.php:/var/www/html/config/config.php:ro
      - banner-cache:/var/www/html/common/server-banner/cache
volumes:
  banner-cache: