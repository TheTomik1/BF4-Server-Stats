<VirtualHost *:443>
    ServerName example.com
    ServerAlias example.com

    ErrorLog ${APACHE_LOG_DIR}/name-of-your-sites-available-file-error.log
    CustomLog ${APACHE_LOG_DIR}/name-of-your-sites-available-file-access.log combined

    SSLEngine On
    SSLCertificateFile your_certificate_file_path
    SSLCertificateKeyFile your_certificate_key_file_path

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass / http://127.0.0.1:{WEB_PORT}/ <- Replace {WEB_PORT} with the actual web port number defined in your .env file
    ProxyPassReverse / http://127.0.0.1:{WEB_PORT}/ <- Replace {WEB_PORT} with the actual web port number defined in your .env file

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000"
</VirtualHost>